<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>صوت ولي الأمر — أكاديمية نهضة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{--maroon:#812146;--maroon-d:#5f1733;--beige:#E3D2AA;--sky:#99DAEE;--orange:#CF8044;--olive:#BCBD32;--grey:#555859;
--bg:#faf7f2;--card:#fff;--ink:#2a2426;--muted:#6f6769;--line:#e8e0d6;--soft:#f5ede3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.6}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 48px}
header{text-align:center;padding:22px 0 8px;position:relative}
header img{width:118px;height:auto;display:block;margin:0 auto}
.lang{position:absolute;top:16px;inset-inline-end:0;background:none;border:1px solid var(--line);border-radius:20px;padding:4px 12px;font:inherit;font-size:13px;color:var(--maroon);cursor:pointer}
h1{font-size:22px;margin:14px 0 4px;color:var(--maroon)}
h2{font-size:19px;margin:6px 0 4px;color:var(--maroon)}
.lead{color:var(--muted);margin:0 0 18px;font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin:12px 0;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.choice{display:flex;gap:14px;align-items:center;width:100%;text-align:start;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:10px 0;font:inherit;color:inherit;cursor:pointer;transition:border-color .15s,transform .1s}
.choice:active{transform:scale(.99)}
.choice:hover{border-color:var(--maroon)}
.choice .ic{flex:0 0 46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:22px}
.choice b{display:block;font-size:16.5px}
.choice small{color:var(--muted);font-size:13.5px}
.ic.d{background:#fff4dc}.ic.a{background:#f6e6ec}.ic.b{background:#e7f5fa}.ic.c{background:#fbeee3}
label.fl{display:block;font-weight:600;margin:14px 0 6px;font-size:15px}
.hint{color:var(--muted);font-size:13px;margin-top:4px}
input[type=text],input[type=tel],select,textarea{width:100%;font:inherit;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--maroon);outline-offset:0;border-color:transparent}
textarea{min-height:110px;resize:vertical}
input[type=tel]{direction:ltr;text-align:left}
[dir=rtl] input[type=tel]{text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 13px;font:inherit;font-size:14.5px;color:var(--ink);cursor:pointer;text-align:start;line-height:1.35}
.chip small{display:block;color:var(--muted);font-size:12px}
.chip.on{background:var(--maroon);border-color:var(--maroon);color:#fff}
.chip.on small{color:#f3dbe4}
.chip.na{border-style:dashed;color:var(--muted)}
.chip.na.on{background:var(--grey);border-color:var(--grey);color:#fff}
.crit{border-top:1px solid var(--line);padding-top:16px;margin-top:16px}
.crit:first-of-type{border-top:0;margin-top:0;padding-top:0}
.crit .q{font-weight:600;margin-bottom:10px;display:flex;gap:10px}
.crit .n{flex:0 0 26px;height:26px;border-radius:50%;background:var(--soft);color:var(--maroon);display:grid;place-items:center;font-size:13px;font-weight:700}
.crit.miss .q{color:#b42318}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px;font:inherit;font-weight:700;font-size:16px;cursor:pointer;margin-top:16px;background:var(--maroon);color:#fff}
.btn:disabled{opacity:.55;cursor:default}
.btn.ghost{background:transparent;color:var(--maroon);border:1px solid var(--line);font-weight:600}
.back{background:none;border:0;color:var(--maroon);font:inherit;font-size:14px;cursor:pointer;padding:6px 0}
.progress{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:8px 0 2px}
.progress i{display:block;height:100%;background:var(--maroon);width:0;transition:width .25s}
.pmeta{font-size:12.5px;color:var(--muted)}
.note{background:var(--soft);border-radius:12px;padding:12px 14px;font-size:13.5px;color:#5c4f45;margin-top:12px}
.err{color:#b42318;font-size:14px;margin-top:10px;min-height:1em}
.done{text-align:center;padding:26px 18px}
.done .big{font-size:46px}
.hidden{display:none!important}
.stars{display:flex;gap:6px}
.star{background:none;border:0;font-size:34px;line-height:1;color:#ddd3c7;cursor:pointer;padding:2px}
.star.on{color:#d49a2a}
.mq{font-weight:600;margin:16px 0 6px}.mq:first-child{margin-top:0}
.slabel{font-size:12.5px;color:var(--muted);min-height:1.2em}
.invite{background:#fff8ec;border:1px solid #f0dfbf;border-radius:14px;padding:14px;margin-top:16px}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:28px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <button class="lang" id="langBtn" type="button">English</button>
  <img src="logo.png" alt="أكاديمية نهضة العالمية — Nahda Academy" width="320" height="231">
</header>

<!-- HOME -->
<section id="v-home">
  <h1 data-t="homeTitle"></h1>
  <p class="lead" data-t="homeLead"></p>
  <button class="choice" data-go="vote1"><span class="ic a">🌟</span><span><b data-t="c1t"></b><small data-t="c1s"></small></span></button>
  <button class="choice" data-go="meet"><span class="ic d">⭐</span><span><b data-t="c4t"></b><small data-t="c4s"></small></span></button>
  <button class="choice" data-go="sugg"><span class="ic b">💡</span><span><b data-t="c2t"></b><small data-t="c2s"></small></span></button>
  <button class="choice" data-go="comp"><span class="ic c">📝</span><span><b data-t="c3t"></b><small data-t="c3s"></small></span></button>
</section>

<!-- VOTE step 1 -->
<section id="v-vote1" class="hidden">
  <button class="back" data-go="home" data-t="back"></button>
  <h2 data-t="c1t"></h2>
  <div class="progress"><i style="width:15%"></i></div><div class="pmeta" data-t="step1"></div>
  <div class="card">
    <label class="fl" data-t="pickClass"></label>
    <div class="chips" id="classChips"></div>
    <div id="trackBox" class="hidden"><label class="fl" data-t="track"></label><div class="chips" id="trackChips"></div></div>
    <label class="fl" for="vStudent" data-t="studentV"></label>
    <input type="text" id="vStudent" maxlength="80" autocomplete="off">
    <div class="hint" data-t="studentHint"></div>
    <div class="err" id="err1"></div>
    <button class="btn" id="next1" data-t="next"></button>
  </div>
</section>

<!-- VOTE step 2 -->
<section id="v-vote2" class="hidden">
  <button class="back" data-go="vote1" data-t="back"></button>
  <h2 data-t="critTitle"></h2>
  <div class="progress"><i id="pbar" style="width:30%"></i></div><div class="pmeta" id="pmeta"></div>
  <p class="lead" style="margin-top:10px" data-t="critLead"></p>
  <div class="card" id="critBox"></div>
  <div class="err" id="err2"></div>
  <button class="btn" id="next2" data-t="next"></button>
</section>

<!-- VOTE step 3 -->
<section id="v-vote3" class="hidden">
  <button class="back" data-go="vote2" data-t="back"></button>
  <h2 data-t="thanksTitle"></h2>
  <div class="progress"><i style="width:90%"></i></div><div class="pmeta" data-t="step3"></div>
  <div class="card">
    <p style="margin:0" data-t="thanksLead"></p>
    <label class="fl" data-t="thanksWho"></label>
    <div class="chips" id="thanksChips"></div>
    <label class="fl" for="thanksTx" data-t="thanksMsg"></label>
    <textarea id="thanksTx" maxlength="1000"></textarea>
    <div class="hint" data-t="thanksHint"></div>
    <div class="err" id="err3"></div>
    <button class="btn" id="sendVote" data-t="send"></button>
  </div>
</section>

<!-- SUGGESTION -->
<section id="v-sugg" class="hidden">
  <button class="back" data-go="home" data-t="back"></button>
  <h2 data-t="c2t"></h2>
  <div class="card">
    <label class="fl" for="sCat" data-t="topic"></label>
    <select id="sCat"></select>
    <label class="fl" for="sClass" data-t="classOpt"></label>
    <select id="sClass"></select>
    <label class="fl" for="sBody" data-t="suggBody"></label>
    <textarea id="sBody" maxlength="2000"></textarea>
    <label class="fl" for="sName" data-t="nameOpt"></label>
    <input type="text" id="sName" maxlength="80" autocomplete="name">
    <label class="fl" for="sPhone" data-t="phoneOpt"></label>
    <input type="tel" id="sPhone" inputmode="tel" placeholder="05xxxxxxxx" maxlength="20">
    <div class="hint" data-t="anonHint"></div>
    <div class="err" id="errS"></div>
    <button class="btn" id="sendS" data-t="send"></button>
  </div>
</section>

<!-- COMPLAINT -->
<section id="v-comp" class="hidden">
  <button class="back" data-go="home" data-t="back"></button>
  <h2 data-t="c3t"></h2>
  <div class="note" data-t="compNote"></div>
  <div class="card">
    <label class="fl" for="cCat" data-t="topic"></label>
    <select id="cCat"></select>
    <label class="fl" for="cClass" data-t="classReq"></label>
    <select id="cClass"></select>
    <label class="fl" for="cStudent" data-t="student"></label>
    <input type="text" id="cStudent" maxlength="80">
    <label class="fl" for="cName" data-t="parentName"></label>
    <input type="text" id="cName" maxlength="80" autocomplete="name">
    <label class="fl" for="cPhone" data-t="phone"></label>
    <input type="tel" id="cPhone" inputmode="tel" autocomplete="tel" placeholder="05xxxxxxxx">
    <label class="fl" for="cBody" data-t="compBody"></label>
    <textarea id="cBody" maxlength="3000"></textarea>
    <div class="err" id="errC"></div>
    <button class="btn" id="sendC" data-t="send"></button>
  </div>
</section>

<!-- MEETING -->
<section id="v-meet" class="hidden">
  <button class="back" data-go="home" data-t="back"></button>
  <h2 data-t="c4t"></h2>
  <p class="lead" data-t="meetLead"></p>
  <div class="card" id="meetBox"></div>
  <div class="card">
    <label class="fl" for="mComment" data-t="meetComment"></label>
    <textarea id="mComment" maxlength="1500"></textarea>
    <div class="err" id="errM"></div>
    <button class="btn" id="sendM" data-t="send"></button>
  </div>
</section>

<!-- DONE -->
<section id="v-done" class="hidden">
  <div class="card done">
    <div class="big">💐</div>
    <h2 id="doneTitle"></h2>
    <p class="lead" id="doneMsg"></p>
    <div class="invite hidden" id="meetInvite"><b data-t="inviteT"></b><div class="hint" data-t="inviteS"></div><button class="btn" data-go="meet" data-t="inviteB"></button></div>
    <button class="btn" id="anotherChild" data-t="another"></button>
    <button class="btn ghost" data-go="home" data-t="toHome"></button>
  </div>
</section>

<footer data-t="foot"></footer>
</div>

let lang="ar";
try{const s=localStorage.getItem("nahda_fb_lang");if(s==="en"||s==="ar")lang=s;}catch(e){}
const st={cls:null,picks:{},order:{},thanks:null,meet:{}};
let meetDone=false;try{meetDone=localStorage.getItem("nahda_meet_done")==="1"}catch(e){}
const $=id=>document.getElementById(id);
const t=k=>I18N[lang][k]||k;
const num=n=>lang==="ar"?String(n).replace(/\d/g,d=>"٠١٢٣٤٥٦٧٨٩"[d]):String(n);
const tName=n=>lang==="ar"?"أ. "+(T_AR[n]||n):(T_EN[n]||n);
const cc=()=>st.cls==="12"?st.track:st.cls;
const tSubj=n=>{const s=TEACH[cc()]?.[n]||[];return s.map(x=>lang==="ar"?(SUBJ_AR[x]||x):(SUBJ_EN[x]||x)).join(" · ");};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const validName=n=>{const w=(n||"").trim().split(/\s+/).filter(Boolean);return w.length>=2&&w.join("").length>=4;};
const validPhone=p=>{const d=(p||"").replace(/\D/g,"");const r=d.slice(-9);return r.length===9&&r[0]==="5";};

function show(v){document.querySelectorAll("section[id^=v-]").forEach(s=>s.classList.toggle("hidden",s.id!=="v-"+v));window.scrollTo(0,0);
  if(v==="vote2")renderCrit();if(v==="meet")renderMeet();if(v==="vote3")renderThanks();}
document.addEventListener("click",e=>{const g=e.target.closest("[data-go]");if(g)show(g.dataset.go);});

function applyLang(){
  document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";
  document.title=lang==="ar"?"صوت ولي الأمر — أكاديمية نهضة":"Parent Voice — Nahda Academy";
  $("langBtn").textContent=lang==="ar"?"English":"العربية";
  document.querySelectorAll("[data-t]").forEach(el=>el.textContent=t(el.dataset.t));
  renderClassChips();fillSelects();
  if(!$("v-vote2").classList.contains("hidden"))renderCrit();
  if(!$("v-meet").classList.contains("hidden"))renderMeet();
  if(!$("v-vote3").classList.contains("hidden"))renderThanks();
}
$("langBtn").onclick=()=>{lang=lang==="ar"?"en":"ar";try{localStorage.setItem("nahda_fb_lang",lang)}catch(e){};applyLang();};

function renderClassChips(){
  const box=$("classChips");box.innerHTML="";
  CLASS_ORDER.forEach(c=>{const b=document.createElement("button");b.type="button";b.className="chip"+(st.cls===c?" on":"");b.textContent=CLASS_NAME[lang][c];
    b.onclick=()=>{if(st.cls!==c){st.cls=c;st.track=null;st.picks={};st.order={};st.thanks=null;}renderClassChips();};box.appendChild(b);});
  $("trackBox").classList.toggle("hidden",st.cls!=="12");
  const tb=$("trackChips");tb.innerHTML="";
  [["12-A","A Level"],["12-D",lang==="ar"?"الدبلوم":"Diploma"]].forEach(([k,l])=>{const b=document.createElement("button");b.type="button";b.className="chip"+(st.track===k?" on":"");b.textContent=l;
    b.onclick=()=>{if(st.track!==k){st.track=k;st.picks={};st.order={};st.thanks=null;}renderClassChips();};tb.appendChild(b);});
}
function fillSelects(){
  const opt=(sel,list,keep)=>{const v=sel.value;sel.innerHTML="";list.forEach(([k,l])=>{const o=document.createElement("option");o.value=k;o.textContent=l;sel.appendChild(o);});if(keep&&v)sel.value=v;};
  opt($("sCat"),CATS_S[lang],1);opt($("cCat"),CATS_C[lang],1);
  const cl=[["",t("choose")]].concat(CLASS_ORDER.map(c=>[c,CLASS_NAME[lang][c]]));opt($("sClass"),cl,1);opt($("cClass"),cl,1);
}

$("next1").onclick=()=>{
  $("err1").textContent="";
  if(!st.cls){$("err1").textContent=t("e_class");return;}
  if(st.cls==="12"&&!st.track){$("err1").textContent=t("e_track");return;}
  if(!validName($("vStudent").value)){$("err1").textContent=t("e_name");return;}
  show("vote2");
};

function renderCrit(){
  const box=$("critBox");box.innerHTML="";const teachers=Object.keys(TEACH[cc()]||{});
  CRIT.forEach(([k,ar,en],i)=>{
    if(!st.order[k])st.order[k]=shuffle(teachers);
    const d=document.createElement("div");d.className="crit";d.id="crit-"+k;
    d.innerHTML=`<div class="q"><span class="n">${i+1}</span><span></span></div><div class="chips"></div>`;
    d.querySelector(".q span:last-child").textContent=(lang==="ar"?ar:en)+"  ";const u=document.createElement("small");u.style.cssText="color:var(--muted);font-weight:400;font-size:12.5px;white-space:nowrap";u.textContent="("+t("upto")+")";d.querySelector(".q span:last-child").appendChild(u);
    const ch=d.querySelector(".chips");
    st.order[k].forEach(n=>{const b=document.createElement("button");b.type="button";const sel=Array.isArray(st.picks[k])&&st.picks[k].includes(n);b.className="chip"+(sel?" on":"");
      b.innerHTML="<span></span><small></small>";b.firstChild.textContent=tName(n);b.lastChild.textContent=tSubj(n);
      b.onclick=()=>{let a=Array.isArray(st.picks[k])?st.picks[k].slice():[];if(a.includes(n))a=a.filter(x=>x!==n);else{if(a.length>=3){flash(k);return;}a.push(n);}st.picks[k]=a.length?a:undefined;if(!a.length)delete st.picks[k];renderCrit();updateProg();};ch.appendChild(b);});
    const na=document.createElement("button");na.type="button";na.className="chip na"+(st.picks[k]==="na"?" on":"");na.textContent=t("na");
    na.onclick=()=>{st.picks[k]=st.picks[k]==="na"?undefined:"na";if(!st.picks[k])delete st.picks[k];renderCrit();updateProg();};ch.appendChild(na);
    const h=document.createElement("div");h.className="hint";h.id="h-"+k;h.textContent=Array.isArray(st.picks[k])?(lang==="ar"?"اخترت "+num(st.picks[k].length)+" من ٣":st.picks[k].length+" of 3 chosen"):"";d.appendChild(h);
    box.appendChild(d);
  });updateProg();
}
function flash(k){const h=$("h-"+k);if(h){h.textContent=t("max3");h.style.color="#b42318";}}
function updateProg(){const n=CRIT.filter(([k])=>st.picks[k]).length;$("pbar").style.width=(30+n/CRIT.length*50)+"%";
  $("pmeta").textContent=(lang==="ar"?"الخطوة ٢ من ٣ · ":"Step 2 of 3 · ")+num(n)+" "+t("of")+" "+num(CRIT.length);}
$("next2").onclick=()=>{
  $("err2").textContent="";let first=null;
  CRIT.forEach(([k])=>{const el=$("crit-"+k);const miss=!st.picks[k];el.classList.toggle("miss",miss);if(miss&&!first)first=el;});
  if(first){$("err2").textContent=t("e_crit");first.scrollIntoView({behavior:"smooth",block:"center"});return;}
  show("vote3");
};
function renderThanks(){
  const box=$("thanksChips");box.innerHTML="";
  Object.keys(TEACH[cc()]||{}).sort((a,b)=>tName(a).localeCompare(tName(b),lang)).forEach(n=>{
    const b=document.createElement("button");b.type="button";b.className="chip"+(st.thanks===n?" on":"");
    b.innerHTML="<span></span><small></small>";b.firstChild.textContent=tName(n);b.lastChild.textContent=tSubj(n);
    b.onclick=()=>{st.thanks=st.thanks===n?null:n;renderThanks();};box.appendChild(b);});
}

async function rpc(fn,body){
  const r=await fetch(API+fn,{method:"POST",headers:{"apikey":KEY,"Content-Type":"application/json"},body:JSON.stringify(body)});
  if(!r.ok)throw new Error("http "+r.status);return r.json();
}
function busy(btn,on){btn.disabled=on;btn.textContent=on?"…":t("send");}
function done(kind){
  const K={vote:"doneVote",s:"doneS",c:"doneC",m:"doneM"}[kind];
  $("doneTitle").textContent=t(K);$("doneMsg").textContent=t(K+"Msg");
  $("meetInvite").classList.toggle("hidden",meetDone||kind==="m");
  $("anotherChild").classList.toggle("hidden",kind!=="vote");show("done");
}
$("sendVote").onclick=async()=>{
  const btn=$("sendVote");$("err3").textContent="";
  const tx=$("thanksTx").value.trim();
  busy(btn,true);
  try{
    const res=await rpc("submit_vote_v2",{p_class:cc(),p_student:$("vStudent").value,p_picks:st.picks,p_thanks_teacher:st.thanks||"",p_thanks_text:tx});
    if(res==="ok"){done("vote");}
    else if(res==="duplicate"){done("vote");$("doneMsg").textContent=t("e_dup");}
    else if(res==="bad_name"){show("vote1");$("err1").textContent=t("e_name");}
    else $("err3").textContent=t("e_net");
  }catch(e){$("err3").textContent=t("e_net");}
  busy(btn,false);
};
$("anotherChild").onclick=()=>{$("vStudent").value="";st.cls=null;st.track=null;st.picks={};st.order={};st.thanks=null;$("thanksTx").value="";renderClassChips();show("vote1");};

$("sendS").onclick=async()=>{
  const btn=$("sendS");$("errS").textContent="";const body=$("sBody").value.trim();
  if(body.length<3){$("errS").textContent=t("e_empty");return;}
  busy(btn,true);
  try{const r=await rpc("submit_suggestion",{p_class:$("sClass").value,p_category:$("sCat").value,p_body:body,p_name:$("sName").value,p_phone:$("sPhone").value});
    if(r==="ok"){["sBody","sName","sPhone"].forEach(i=>$(i).value="");done("s");}else $("errS").textContent=t("e_net");}
  catch(e){$("errS").textContent=t("e_net");}
  busy(btn,false);
};
$("sendC").onclick=async()=>{
  const btn=$("sendC");const err=$("errC");err.textContent="";
  const body=$("cBody").value.trim();
  if(!$("cClass").value){err.textContent=t("e_class");return;}
  if($("cStudent").value.trim().length<2||$("cName").value.trim().length<2){err.textContent=t("e_missing");return;}
  if(!validPhone($("cPhone").value)){err.textContent=t("e_phone");return;}
  if(body.length<3){err.textContent=t("e_empty");return;}
  busy(btn,true);
  try{const r=await rpc("submit_complaint",{p_class:$("cClass").value,p_category:$("cCat").value,p_body:body,p_name:$("cName").value,p_student:$("cStudent").value,p_phone:$("cPhone").value});
    if(r==="ok"){["cBody","cStudent","cName","cPhone"].forEach(i=>$(i).value="");done("c");}
    else if(r==="bad_phone")err.textContent=t("e_phone");else if(r==="missing")err.textContent=t("e_missing");else err.textContent=t("e_net");}
  catch(e){err.textContent=t("e_net");}
  busy(btn,false);
};

function renderMeet(){
  const box=$("meetBox");box.innerHTML="";
  MEET.forEach(([k,ar,en])=>{
    const q=document.createElement("div");q.className="mq";q.id="mq-"+k;q.textContent=lang==="ar"?ar:en;box.appendChild(q);
    const row=document.createElement("div");row.className="stars";row.setAttribute("role","radiogroup");
    for(let i=1;i<=5;i++){const b=document.createElement("button");b.type="button";b.className="star"+((st.meet[k]||0)>=i?" on":"");b.textContent="★";
      b.setAttribute("aria-label",i+" / 5");b.onclick=()=>{st.meet[k]=i;$("errM").textContent="";renderMeet();};row.appendChild(b);}
    box.appendChild(row);
    const l=document.createElement("div");l.className="slabel";l.textContent=st.meet[k]?STAR_L[lang][st.meet[k]]:"";box.appendChild(l);
  });
}
$("sendM").onclick=async()=>{
  const btn=$("sendM");const err=$("errM");err.textContent="";
  const miss=MEET.filter(([k])=>!st.meet[k]);
  MEET.forEach(([k])=>$("mq-"+k).style.color=st.meet[k]?"":"#b42318");
  if(miss.length){err.textContent=t("e_stars");return;}
  busy(btn,true);
  try{const r=await rpc("submit_meeting",{p_ratings:st.meet,p_comment:$("mComment").value});
    if(r==="ok"){meetDone=true;try{localStorage.setItem("nahda_meet_done","1")}catch(e){};st.meet={};$("mComment").value="";done("m");}else err.textContent=t("e_net");}
  catch(e){err.textContent=t("e_net");}
  busy(btn,false);
};
const go=new URLSearchParams(location.search).get("go");
applyLang();
if(go==="comp"||go==="sugg"||go==="vote"||go==="meet")show(go==="vote"?"vote1":go);
</script>
</body>
</html>
