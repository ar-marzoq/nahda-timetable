<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>لوحة نتائج أولياء الأمور — أكاديمية نهضة</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--maroon:#812146;--beige:#E3D2AA;--grey:#555859;--bg:#f7f4ef;--card:#fff;--ink:#2a2426;--muted:#6f6769;--line:#e6ddd2;--soft:#f5ede3}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:10px}
header img{width:84px;height:auto}
h1{font-size:20px;margin:0;color:var(--maroon)}
.sub{color:var(--muted);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.tile b{display:block;font-size:26px;color:var(--maroon)}
.tile span{color:var(--muted);font-size:13px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 4px}
.tab{border:1px solid var(--line);background:#fff;border-radius:20px;padding:7px 16px;font:inherit;cursor:pointer}
.tab.on{background:var(--maroon);color:#fff;border-color:var(--maroon)}
input,select,textarea,button{font:inherit}
input,select,textarea{border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:#fff}
.btn{background:var(--maroon);color:#fff;border:0;border-radius:10px;padding:9px 16px;cursor:pointer}
.btn.ghost{background:#fff;color:var(--maroon);border:1px solid var(--line)}
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:760px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:center;font-size:13.5px}
th{color:var(--muted);font-weight:600;font-size:12px;vertical-align:bottom}
td.n{text-align:start;font-weight:600;white-space:nowrap}
td.n small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.cell{border-radius:6px;padding:4px 2px;min-width:44px;display:inline-block}
tr.click{cursor:pointer}tr.click:hover td{background:#fbf8f4}
.bar{height:8px;background:var(--soft);border-radius:6px;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--maroon)}
.item{border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0;background:#fff}
.item .meta{color:var(--muted);font-size:12.5px;display:flex;gap:10px;flex-wrap:wrap}
.item .body{white-space:pre-wrap;margin:8px 0}
.pill{border-radius:20px;padding:2px 10px;font-size:12px;background:var(--soft)}
.pill.new{background:#fde8e8;color:#9b1c1c}.pill.in_progress{background:#fff3d6;color:#8a5a00}.pill.closed{background:#e3f4e6;color:#1f6b34}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.hidden{display:none!important}
.thank{border-inline-start:4px solid var(--beige);padding:8px 12px;margin:8px 0;background:#fffdf8;border-radius:8px;white-space:pre-wrap}
.legend{font-size:12.5px;color:var(--muted);margin-top:8px}
.lang{margin-inline-start:auto;background:#fff;border:1px solid var(--line);border-radius:20px;padding:5px 14px;color:var(--maroon);cursor:pointer}
@media print{.noprint{display:none!important}body{background:#fff}.card{border:0}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <img src="logo.png" alt="Nahda Academy — أكاديمية نهضة" width="320" height="231">
  <div><h1 data-t="title"></h1><div class="sub" data-t="subtitle"></div></div>
  <button class="lang noprint" id="langBtn" type="button"></button>
</header>

<div id="login" class="card">
  <p style="margin-top:0" data-t="loginP"></p>
  <div class="row"><input type="password" id="pin" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" dir="ltr"><button class="btn" id="go" data-t="enter"></button></div>
  <div id="lerr" style="color:#b42318;margin-top:8px"></div>
</div>

<div id="app" class="hidden">
  <div class="tiles" id="tiles"></div>
  <div class="tabs noprint">
    <button class="tab on" data-tab="teachers" data-t="tabTeachers"></button>
    <button class="tab" data-tab="thanks" data-t="tabThanks"></button>
    <button class="tab" data-tab="complaints" data-t="tabComplaints"></button>
    <button class="tab" data-tab="suggestions" data-t="tabSuggestions"></button>
    <button class="tab" data-tab="meeting" data-t="tabMeeting"></button>
    <button class="tab" data-tab="classes" data-t="tabClasses"></button>
  </div>

  <section id="t-teachers" class="card">
    <div class="row noprint" style="justify-content:space-between">
      <div class="row"><label data-t="classL"></label><select id="fClass"></select></div>
      <div class="row"><button class="btn ghost" id="csv" data-t="csv"></button><button class="btn ghost" id="refresh" data-t="refresh"></button><button class="btn ghost" onclick="print()" data-t="print"></button><button class="btn ghost" id="logout" data-t="logout"></button></div>
    </div>
    <div class="tblwrap" style="margin-top:12px"><table id="tbl"></table></div>
    <div class="legend" id="legend"></div>
  </section>

  <section id="t-thanks" class="card hidden">
    <div class="row noprint"><label data-t="teacherL"></label><select id="fThank"></select><button class="btn ghost" onclick="print()" data-t="printFor"></button></div>
    <div id="thanksList"></div>
  </section>

  <section id="t-complaints" class="card hidden">
    <div class="row noprint"><label data-t="statusL"></label><select id="fCStatus"></select></div>
    <div id="compList"></div>
  </section>

  <section id="t-suggestions" class="card hidden"><div id="suggList"></div></section>
  <section id="t-meeting" class="card hidden"><div id="meetSum"></div><h3 data-t="meetComments" style="color:var(--maroon);font-size:16px;margin:18px 0 6px"></h3><div id="meetList"></div></section>
  <section id="t-classes" class="card hidden"><div class="tblwrap"><table id="clsTbl"></table></div></section>
</div>
</div>

<script>

const MEET={ar:[["m1","سهولة الوصول إلى القاعات"],["m2","التنظيم وانسيابية الانتظار"],["m3","كفاية الوقت مع كل معلم ومعلمة"],["m4","فائدة المعلومات عن مستوى الأبناء"],["m5","حسن الاستقبال والتعامل"]],

const STATUS={ar:{new:"جديد",in_progress:"قيد المتابعة",closed:"مغلقة"},en:{new:"New",in_progress:"In progress",closed:"Closed"}};
const I={ar:{title:"لوحة نتائج لقاء أولياء الأمور",subtitle:"للإدارة فقط · تقييم المعلمين والمقترحات والملاحظات",loginP:"أدخل رمز الإدارة لعرض النتائج.",pin:"الرمز",enter:"دخول",
 badPin:"الرمز غير صحيح.",net:"تعذّر الاتصال.",tabTeachers:"المعلمون والمعلمات",tabThanks:"رسائل الشكر",tabComplaints:"الملاحظات والشكاوى",tabSuggestions:"المقترحات",tabClasses:"الفصول",tabMeeting:"تقييم اللقاء",meetComments:"ملاحظات أولياء الأمور على اللقاء",noMeet:"لا توجد تقييمات للقاء بعد.",tMeet:"تقييم اللقاء",avg:"المتوسط",responses:"تقييم",overallAvg:"المتوسط العام",hStudent:"الطالب",
 classL:"الفصل:",allClasses:"كل الفصول",allBoys:"قسم البنين — كل الفصول",allGirls:"قسم البنات — كل الفصول",csv:"تصدير CSV",refresh:"تحديث",print:"طباعة",teacherL:"المعلم:",allTeachers:"كل المعلمين",printFor:"طباعة للمعلم",statusL:"الحالة:",all:"الكل",
 tVotes:"تقييم مكتمل",tThanks:"رسالة شكر",tSugg:"مقترح",tComp:"ملاحظة/شكوى",tOpen:"بانتظار المتابعة",
 hTeacher:"المعلم/المعلمة",hResp:"ردود من فصوله/فصولها",hTotal:"الإجمالي",hLift:"الأثر",hThanks:"شكر",of:"من",
 legend:"المعلمون الذين لديهم أقل من ٥ ردود يظهرون باهتين في آخر الجدول لأن نتائجهم غير كافية للحكم. النسبة = من اختاروا المعلم في المعيار ÷ أولياء أمور فصوله الذين أجابوا عن المعيار (دون «لا أستطيع الحكم»). يستطيع ولي الأمر اختيار حتى ٣ معلمين في كل معيار. <b>الأثر</b> = عدد مرات اختيار المعلم ÷ العدد المتوقع بالصدفة (عدد من اختارهم ولي الأمر ÷ عدد معلمي الفصل)، فـ ١٫٠ تعني متوسطاً و٢٫٠ ضعف المتوقع — وهو المقياس الأعدل للمقارنة بين معلمين يدرّسون فصولاً مختلفة. اضغط على أي معلم لعرض رسائل الشكر له.",
 noThanks:"لا توجد رسائل بعد.",noComp:"لا توجد ملاحظات.",noSugg:"لا توجد مقترحات بعد.",anon:"بدون اسم",note:"ملاحظة الإدارة / الإجراء المتخذ",save:"حفظ",saved:"✓ حُفظ",saveErr:"تعذّر الحفظ",
 hClass:"الفصل",hCount:"عدد التقييمات",hTeachers:"عدد المعلمين",hThanksN:"رسائل شكر",hComp:"شكاوى",hSugg:"مقترحات",na:"لا أستطيع الحكم",lang:"English",logout:"خروج"},
en:{title:"Parents' Meeting Results",subtitle:"Leadership only · Teacher ratings, suggestions and concerns",loginP:"Enter the admin code to view results.",pin:"Code",enter:"Sign in",
 badPin:"Incorrect code.",net:"Couldn't connect.",tabTeachers:"Teachers",tabThanks:"Thank-you notes",tabComplaints:"Concerns & complaints",tabSuggestions:"Suggestions",tabClasses:"Classes",tabMeeting:"Meeting rating",meetComments:"Parents' comments on the meeting",noMeet:"No meeting ratings yet.",tMeet:"Meeting ratings",avg:"Average",responses:"ratings",overallAvg:"Overall average",hStudent:"Student",
 classL:"Class:",allClasses:"All classes",allBoys:"Boys — all classes",allGirls:"Girls — all classes",csv:"Export CSV",refresh:"Refresh",print:"Print",teacherL:"Teacher:",allTeachers:"All teachers",printFor:"Print for teacher",statusL:"Status:",all:"All",
 tVotes:"Ratings",tThanks:"Thank-you notes",tSugg:"Suggestions",tComp:"Concerns",tOpen:"Awaiting follow-up",

 legend:"Teachers with fewer than 5 responses are faded and listed last, as their results are too few to judge. Rate = parents who chose the teacher for a quality ÷ parents in that teacher's classes who answered it (excluding “Can't judge”). Parents can choose up to 3 teachers per quality. <b>Impact</b> = times chosen ÷ times expected by chance (teachers the parent picked ÷ teachers in the class), so 1.0 is average and 2.0 is double — the fairest way to compare teachers of different classes. Click a teacher to see their thank-you notes.",
 noThanks:"No notes yet.",noComp:"No concerns.",noSugg:"No suggestions yet.",anon:"Anonymous",note:"Leadership note / action taken",save:"Save",saved:"✓ Saved",saveErr:"Couldn't save",
 hClass:"Class",hCount:"Ratings",hTeachers:"Teachers",hThanksN:"Thank-you notes",hComp:"Concerns",hSugg:"Suggestions",na:"Can't judge",lang:"العربية",logout:"Sign out"}};
let lang="ar";try{const v=localStorage.getItem("nahda_admin_lang");if(v==="en")lang="en";}catch(e){}
const L=k=>I[lang][k];
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const tn=n=>lang==="ar"?"أ. "+(T_AR[n]||n):(T_EN[n]||n);
const cn=c=>CLASS_NAME[lang][c]?SEC_NAME[lang][secOf(c)]+" — "+CLASS_NAME[lang][c]:c;
const pct=x=>x==null?"—":Math.round(x*100)+"%";
const dt=s=>new Date(s).toLocaleString(lang==="ar"?"ar-SA-u-nu-latn-ca-gregory":"en-GB",{dateStyle:"medium",timeStyle:"short"});
const pickList=v=>Array.isArray(v)?v:(v&&v!=="na"?[v]:[]);
let PIN="",D=null;
try{PIN=sessionStorage.getItem("nahda_admin_pin")||"";}catch(e){}

function applyLang(){
  document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";
  document.title=L("title")+(lang==="ar"?" — أكاديمية نهضة":" — Nahda Academy");
  document.querySelectorAll("[data-t]").forEach(el=>el.textContent=L(el.dataset.t));
  $("langBtn").textContent=L("lang");$("pin").placeholder=L("pin");$("legend").innerHTML=L("legend");
  const fs=$("fCStatus"),v=fs.value;fs.innerHTML=`<option value="">${L("all")}</option>`+Object.entries(STATUS[lang]).map(([k,l])=>`<option value="${k}">${l}</option>`).join("");fs.value=v;
  if(D)render();
}
$("langBtn").onclick=()=>{lang=lang==="ar"?"en":"ar";try{localStorage.setItem("nahda_admin_lang",lang)}catch(e){};applyLang();};

async function rpc(fn,body){const r=await fetch(API+fn,{method:"POST",headers:{apikey:KEY,"Content-Type":"application/json"},body:JSON.stringify(body)});if(!r.ok)throw new Error(r.status);return r.json();}
async function load(){
  const d=await rpc("admin_data",{p_pin:PIN});
  if(d.error){$("lerr").textContent=L("badPin");$("login").classList.remove("hidden");$("app").classList.add("hidden");return;}
  try{sessionStorage.setItem("nahda_admin_pin",PIN)}catch(e){}
  D=d;$("login").classList.add("hidden");$("app").classList.remove("hidden");render();
}
$("go").onclick=()=>{PIN=$("pin").value.trim();$("lerr").textContent="";load().catch(()=>$("lerr").textContent=L("net"));};
$("pin").onkeydown=e=>{if(e.key==="Enter")$("go").click();};
$("refresh").onclick=()=>{const b=$("refresh");b.disabled=true;load().catch(()=>alert(L("net"))).finally(()=>b.disabled=false);};
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x===b));
  document.querySelectorAll("section[id^=t-]").forEach(s=>s.classList.toggle("hidden",s.id!=="t-"+b.dataset.tab));});

function classTeachers(){const m={};D.teachers.forEach(({c,t})=>{(m[c]=m[c]||[]).push(t);});return m;}
function stats(filter){
  const ct=classTeachers();const S={};
  const get=t=>S[t]=S[t]||{t,classes:new Set(),resp:0,crit:{},num:0,den:0,exp:0,thanks:0};
  const inF=c=>!filter||filter===c||(filter==='SEC:B'&&secOf(c)==='B')||(filter==='SEC:G'&&secOf(c)==='G');
  D.teachers.forEach(({c,t})=>{if(inF(c))get(t).classes.add(c);});
  D.votes.forEach(v=>{
    if(!inF(v.c))return;const ts=ct[v.c]||[];if(!ts.length)return;
    ts.forEach(t=>{const s=get(t);s.resp++;
      CRIT.ar.forEach(([k])=>{const p=pickList(v.p[k]);if(!p.length)return;const c=s.crit[k]=s.crit[k]||{num:0,den:0,exp:0};
        const e=Math.min(1,p.length/ts.length);c.den++;c.exp+=e;s.den++;s.exp+=e;if(p.includes(t)){c.num++;s.num++;}});});
    if(v.tt&&v.tx&&S[v.tt])S[v.tt].thanks++;
  });
  Object.values(S).forEach(s=>{s.lift=s.exp?s.num/s.exp:null;s.rate=s.den?s.num/s.den:null;});
  return Object.values(S).filter(s=>s.classes.size);
}
function heat(r){if(r==null)return"#f4f1ec";const a=Math.min(1,r*1.6);return`rgba(129,33,70,${(0.08+a*0.8).toFixed(2)})`;}

function renderTiles(){
  const open=D.complaints.filter(c=>c.status!=="closed").length;
  $("tiles").innerHTML=[[D.votes.length,L("tVotes")],[D.votes.filter(v=>v.tx).length,L("tThanks")],[D.suggestions.length,L("tSugg")],[D.complaints.length,L("tComp")],[open,L("tOpen")],[(D.meeting||[]).length,L("tMeet")]]
    .map(([n,l])=>`<div class="tile"><b>${n}</b><span>${l}</span></div>`).join("");
}
function render(){
  const ct=classTeachers();
  renderTiles();
  const fc=$("fClass");const keep=fc.value;
  fc.innerHTML=`<option value="">${L("allClasses")}</option><option value="SEC:B">${L("allBoys")}</option><option value="SEC:G">${L("allGirls")}</option>`+CLASS_ORDER.filter(c=>ct[c]).map(c=>`<option value="${c}">${cn(c)}</option>`).join("");fc.value=keep;
  renderTeachers();renderThanks();renderComplaints();renderSuggestions();renderClasses(ct);renderMeeting();
}
$("fClass").onchange=()=>renderTeachers();

function renderTeachers(){
  const f=$("fClass").value;const MIN_N=5;const rows=stats(f).sort((a,b)=>((b.resp>=MIN_N)-(a.resp>=MIN_N))||(b.lift??-1)-(a.lift??-1)||b.resp-a.resp);
  const crit=CRIT[lang];
  $("tbl").innerHTML=`<thead><tr><th style="text-align:start">${L("hTeacher")}</th><th>${L("hResp")}</th>${crit.map(([k,l])=>`<th>${l}</th>`).join("")}<th>${L("hTotal")}</th><th>${L("hLift")}</th><th>${L("hThanks")}</th></tr></thead><tbody>`+
  rows.map(s=>`<tr class="click" data-t="${esc(s.t)}"${s.resp<MIN_N?' style="opacity:.55"':""}><td class="n">${esc(tn(s.t))}<small>${[...s.classes].sort((a,b)=>CLASS_ORDER.indexOf(a)-CLASS_ORDER.indexOf(b)).map(cn).join(lang==="ar"?"، ":", ")}</small></td><td>${s.resp}</td>`+
   crit.map(([k])=>{const c=s.crit[k];const r=c&&c.den?c.num/c.den:null;return`<td><span class="cell" style="background:${heat(r)};color:${r!=null&&r>.4?"#fff":"inherit"}" title="${c?c.num+" "+L("of")+" "+c.den:""}">${pct(r)}</span></td>`;}).join("")+
   `<td>${pct(s.rate)}</td><td><b>${s.lift==null?"—":s.lift.toFixed(1)}</b></td><td>${s.thanks||""}</td></tr>`).join("")+`</tbody>`;
  document.querySelectorAll("#tbl tr.click").forEach(tr=>tr.onclick=()=>{$("fThank").value=tr.dataset.t;renderThanks();document.querySelector('[data-tab="thanks"]').click();});
}
function renderThanks(){
  const sel=$("fThank");const keep=sel.value;
  const names=[...new Set(D.teachers.map(x=>x.t))].sort((a,b)=>tn(a).localeCompare(tn(b),lang));
  sel.innerHTML=`<option value="">${L("allTeachers")}</option>`+names.map(n=>`<option value="${esc(n)}">${esc(tn(n))}</option>`).join("");sel.value=keep;
  const list=D.votes.filter(v=>v.tx&&(!sel.value||v.tt===sel.value));
  $("thanksList").innerHTML=list.length?list.map(v=>`<div class="thank" dir="auto"><div class="muted" style="font-size:12.5px">${v.tt?esc(tn(v.tt))+" · ":""}${v.s?esc(v.s)+" · ":""}${esc(cn(v.c))} · ${dt(v.at)}</div>${esc(v.tx)}</div>`).join(""):`<p class="muted">${L("noThanks")}</p>`;
}
$("fThank").onchange=renderThanks;

function itemHTML(x,kind){
  const who=kind==="complaint"?`<div class="row" style="margin-top:4px"><span>👤 ${esc(x.parent_name)}</span><span>🎓 ${esc(x.student_name)}</span><a href="tel:${esc(x.phone)}" dir="ltr">${esc(x.phone)}</a></div>`
    :(x.parent_name||x.phone?`<div class="row" style="margin-top:4px">${x.parent_name?`<span>👤 ${esc(x.parent_name)}</span>`:""}${x.phone?`<a href="tel:${esc(x.phone)}" dir="ltr">${esc(x.phone)}</a>`:""}</div>`:`<div class="muted" style="font-size:12.5px">${L("anon")}</div>`);
  return `<div class="item"><div class="meta"><span class="pill ${x.status}">${STATUS[lang][x.status]||esc(x.status)}</span><span>#${x.id}</span><span>${CAT[lang][x.category]||esc(x.category)}</span>${x.class_id?`<span>${esc(cn(x.class_id))}</span>`:""}<span>${dt(x.created_at)}</span></div>
  ${who}<div class="body" dir="auto">${esc(x.body)}</div>
  <div class="row noprint"><select data-st="${kind}:${x.id}">${Object.entries(STATUS[lang]).map(([k,l])=>`<option value="${k}"${k===x.status?" selected":""}>${l}</option>`).join("")}</select>
  <input data-note="${kind}:${x.id}" style="flex:1;min-width:180px" placeholder="${L("note")}" value="${esc(x.admin_note||"")}"><button class="btn ghost" data-save="${kind}:${x.id}">${L("save")}</button><span class="muted" data-ok="${kind}:${x.id}"></span></div></div>`;
}
function bindSave(){document.querySelectorAll("[data-save]").forEach(b=>b.onclick=async()=>{
  const key=b.dataset.save;const[kind,id]=key.split(":");const status=document.querySelector(`[data-st="${key}"]`).value;const note=document.querySelector(`[data-note="${key}"]`).value;
  const ok=document.querySelector(`[data-ok="${key}"]`);ok.textContent="…";
  try{const r=await rpc("admin_update",{p_pin:PIN,p_kind:kind,p_id:+id,p_status:status,p_note:note});
    if(r==="ok"){const arr=kind==="complaint"?D.complaints:D.suggestions;const x=arr.find(i=>i.id==id);x.status=status;x.admin_note=note;const pill=b.closest(".item").querySelector(".pill");pill.className="pill "+status;pill.textContent=STATUS[lang][status];ok.textContent=L("saved");renderTiles();}else ok.textContent=L("saveErr");}
  catch(e){ok.textContent=L("saveErr");}});}
function renderComplaints(){const f=$("fCStatus").value;const l=D.complaints.filter(c=>!f||c.status===f);
  $("compList").innerHTML=l.length?l.map(c=>itemHTML(c,"complaint")).join(""):`<p class="muted">${L("noComp")}</p>`;bindSave();}
$("fCStatus").onchange=renderComplaints;
function renderSuggestions(){$("suggList").innerHTML=D.suggestions.length?D.suggestions.map(s=>itemHTML(s,"suggestion")).join(""):`<p class="muted">${L("noSugg")}</p>`;bindSave();}
function renderClasses(ct){
  $("clsTbl").innerHTML=`<thead><tr><th style="text-align:start">${L("hClass")}</th><th>${L("hCount")}</th><th>${L("hTeachers")}</th><th>${L("hThanksN")}</th><th>${L("hComp")}</th><th>${L("hSugg")}</th></tr></thead><tbody>`+
  CLASS_ORDER.filter(c=>ct[c]||D.complaints.some(x=>x.class_id===c)||D.suggestions.some(x=>x.class_id===c)).map(c=>`<tr><td class="n">${cn(c)}</td><td>${D.votes.filter(v=>v.c===c).length}</td><td>${(ct[c]||[]).length}</td><td>${D.votes.filter(v=>v.c===c&&v.tx).length}</td><td>${D.complaints.filter(x=>x.class_id===c).length}</td><td>${D.suggestions.filter(x=>x.class_id===c).length}</td></tr>`).join("")+`</tbody>`;
}
function renderMeeting(){
  const M=D.meeting||[];
  if(!M.length){$("meetSum").innerHTML=`<p class="muted">${L("noMeet")}</p>`;$("meetList").innerHTML="";return;}
  let tot=0,totN=0;
  const rows=MEET[lang].map(([k,l])=>{const vals=M.map(m=>m.r[k]).filter(Boolean);const n=vals.length;const a=n?vals.reduce((x,y)=>x+y,0)/n:0;tot+=a*n;totN+=n;
    const dist=[5,4,3,2,1].map(i=>vals.filter(v=>v===i).length);
    return `<div class="item"><div class="row" style="justify-content:space-between"><b>${l}</b><span><span dir="ltr"><b style="color:var(--maroon);font-size:18px">${n?a.toFixed(1):"—"}</b> <span class="muted">/ 5</span></span> <span class="muted">· ${n} ${L("responses")}</span></span></div>
    <div class="bar" style="margin:8px 0"><i style="width:${(a/5*100).toFixed(0)}%"></i></div>
    <div class="row muted" style="font-size:12.5px;gap:12px">${dist.map((c,j)=>`<span>${"★".repeat(5-j)} ${c}</span>`).join("")}</div></div>`;});
  $("meetSum").innerHTML=`<div class="tile" style="margin-bottom:6px"><b dir="ltr">${totN?(tot/totN).toFixed(1):"—"} / 5</b><span>${L("overallAvg")} · ${M.length} ${L("responses")}</span></div>`+rows.join("");
  const cm=M.filter(m=>m.cm);
  $("meetList").innerHTML=cm.length?cm.map(m=>`<div class="thank" dir="auto"><div class="muted" style="font-size:12.5px">${dt(m.at)}</div>${esc(m.cm)}</div>`).join(""):`<p class="muted">—</p>`;
}
const safeCsv=x=>{let v=String(x??"");if(/^[=+\-@\t\r]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"';};
$("csv").onclick=()=>{
  const crit=CRIT[lang];
  const head=["id",lang==="ar"?"التاريخ":"date",L("hClass"),L("hStudent"),...crit.map(c=>c[1]),L("hThanks"),lang==="ar"?"نص الشكر":"thanks_text"];
  const rows=D.votes.map(v=>[v.id,v.at,cn(v.c),v.s||"",...crit.map(([k])=>v.p[k]==="na"?L("na"):pickList(v.p[k]).map(tn).join(" | ")),v.tt?tn(v.tt):"",v.tx||""]);
  const csv="﻿"+[head,...rows].map(r=>r.map(safeCsv).join(",")).join("\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="nahda-parent-votes.csv";a.click();
};
$("logout").onclick=()=>{try{sessionStorage.removeItem("nahda_admin_pin")}catch(e){};PIN="";D=null;$("pin").value="";$("app").classList.add("hidden");$("login").classList.remove("hidden");};
applyLang();
if(PIN)load().catch(()=>{});
</script>
</body>
</html>
