<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Timetable &amp; Duty Roster — Nahda Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --maroon:#812146; --maroon-dk:#5C1732; --maroon-tint:#F3E7EC; --maroon-soft:#EADCE2;
  --ink:#2E2A2B; --ink-soft:#6B6467; --ink-faint:#9A9295;
  --paper:#F7F3EC; --card:#FFFFFF; --rule:#E0D6C4; --rule-soft:#EFE8DC;
  --beige:#E3D2AA; --olive:#7E8020; --olive-tint:#F0F2DE;
  --orange:#CF8044; --orange-tint:#FBEEE2; --orange-ink:#8A4A16;
  --sky:#99DAEE; --sky-tint:#EAF7FC; --rose:#A87571;
  --shadow:0 1px 2px rgba(46,42,43,.05),0 10px 28px -20px rgba(46,42,43,.35);
  --display:"Reem Kufi";
}
html[lang="en"]{--display:"Barlow Condensed"}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);
  font-family:"IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;
  font-size:15px;line-height:1.6;font-variant-numeric:tabular-nums}
html[lang="en"] body{font-family:"IBM Plex Sans Arabic",system-ui,"Segoe UI",sans-serif;letter-spacing:.005em}
.wrap{max-width:1400px;margin:0 auto;padding:0 18px 80px}
.masthead{border-bottom:3px double var(--maroon);padding:22px 0 14px;
  display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px}
.mark{width:96px;height:auto;flex:none;display:block}
@media(max-width:700px){.mark{width:70px}}
@media print{.mark{width:80px}}
.eyebrow{font-family:var(--display);font-size:11.5px;letter-spacing:.18em;color:var(--maroon);margin:0 0 2px}
h1{font-family:var(--display);font-weight:700;font-size:30px;line-height:1.15;margin:0;color:var(--maroon-dk)}
html[lang="en"] h1{font-size:36px;letter-spacing:.01em;text-transform:uppercase}
.sub{margin:3px 0 0;color:var(--ink-soft);font-size:13px}
.rightcol{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.meta{text-align:end;font-size:12px;color:var(--ink-soft);line-height:1.85}
.meta b{font-family:var(--display);color:var(--maroon)}
.lang{display:inline-flex;border:1px solid var(--rule);border-radius:3px;overflow:hidden;background:#fff}
.lang button{font-family:var(--display);font-size:13px;background:none;border:0;padding:6px 14px;cursor:pointer;color:var(--ink-soft)}
.lang button[aria-pressed="true"]{background:var(--maroon);color:#fff}
.lang button:focus-visible{outline:2px solid var(--maroon);outline-offset:-2px}
nav{display:flex;gap:2px;flex-wrap:wrap;border-bottom:1px solid var(--rule);margin-bottom:22px;
  position:sticky;top:0;background:var(--paper);z-index:20;padding-top:6px}
nav button{font-family:var(--display);font-size:15px;background:none;border:0;border-bottom:3px solid transparent;
  padding:10px 20px;cursor:pointer;color:var(--ink-soft)}
nav button[aria-selected="true"]{color:var(--maroon);border-bottom-color:var(--maroon)}
nav button:hover{color:var(--maroon-dk)}
nav button:focus-visible{outline:2px solid var(--maroon);outline-offset:-3px}
.panel{background:var(--card);border:1px solid var(--rule);border-radius:3px;box-shadow:var(--shadow);
  padding:18px 20px;margin-bottom:20px}
.panel-h{display:flex;align-items:baseline;gap:12px;margin:0 0 14px;flex-wrap:wrap}
.panel-h h2{font-family:var(--display);font-size:18px;margin:0;color:var(--maroon-dk);font-weight:600}
.hint{font-size:12.5px;color:var(--ink-soft)}
.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
label.f{font-size:13px;color:var(--ink-soft);display:flex;align-items:center;gap:7px}
select,input[type=search]{font-family:inherit;font-size:14px;padding:6px 10px;border:1px solid var(--rule);
  border-radius:3px;background:#fff;color:var(--ink)}
select:focus-visible,input:focus-visible{outline:2px solid var(--maroon);outline-offset:1px}
.btn{font-family:inherit;font-size:13.5px;border:1px solid var(--rule);background:#fff;color:var(--ink);
  border-radius:3px;padding:7px 15px;cursor:pointer}
.btn:hover{border-color:var(--maroon);color:var(--maroon)}
.btn:focus-visible{outline:2px solid var(--maroon);outline-offset:2px}
.btn.primary{background:var(--maroon);border-color:var(--maroon);color:#fff}
.btn.primary:hover{background:var(--maroon-dk);color:#fff}
.btn:disabled{opacity:.65;cursor:progress}
.btnsep{width:1px;height:24px;background:var(--rule);margin:0 2px}
.daytabs{display:flex;gap:0;flex-wrap:wrap;border-bottom:1px solid var(--rule);margin-bottom:14px}
.daytabs button{font-family:var(--display);font-size:14.5px;background:none;border:0;border-bottom:3px solid transparent;
  padding:8px 16px;cursor:pointer;color:var(--ink-soft)}
.daytabs button[aria-selected="true"]{color:var(--maroon);border-bottom-color:var(--maroon)}
.daytabs .n{font-size:11px;color:var(--ink-faint);margin-inline-start:5px}
.scroll{overflow-x:auto;border:1px solid var(--rule);border-radius:3px}
table.grid{border-collapse:collapse;width:100%;font-size:13px;min-width:860px}
table.grid th,table.grid td{border:1px solid var(--rule-soft);padding:0}
table.grid thead th{background:var(--maroon);color:#fff;font-family:var(--display);font-weight:500;
  padding:7px 6px;font-size:12.5px;line-height:1.3;position:sticky;top:0}
table.grid thead th .tm{display:block;font-size:10px;opacity:.78;font-family:"IBM Plex Sans Arabic"}
table.grid thead th.brk{background:var(--maroon-dk)}
table.grid th.tname{background:var(--maroon-dk);text-align:start;min-width:190px;padding-inline-start:12px}
td.tname{background:#FBF8F3;font-weight:600;text-align:start;padding:6px 12px;font-size:13.5px;white-space:nowrap}
td.tname .s{display:block;font-weight:400;font-size:11px;color:var(--ink-soft)}
td.cell{text-align:center;height:42px;padding:3px 4px;line-height:1.25}
td.cell .c{font-weight:600;font-size:13.5px;display:block}
td.cell .s{font-size:10.5px;color:var(--ink-soft);display:block}
td.brk{background:#FAF6EE}
td.off{background:var(--orange-tint)} td.off .c{color:var(--orange-ink)}
.duty{display:inline-block;font-family:var(--display);font-size:11px;color:#fff;background:var(--maroon);
  border-radius:2px;padding:2px 8px;letter-spacing:.04em}
tr.dim td{opacity:.32}
tr.focus td{background:var(--maroon-tint)!important;box-shadow:inset 0 0 0 1px var(--maroon-soft)}
tr.focus td.tname{background:var(--maroon)!important;color:#fff}
tr.focus td.tname .s{color:#EBD3DC}
tr.focus td.off{background:#F6DFC9!important}
table.wide{border-collapse:separate;border-spacing:0;font-size:10.5px;min-width:2000px}
table.wide th,table.wide td{border:1px solid var(--rule-soft);padding:0}
table.wide thead th{background:var(--maroon);color:#fff;font-family:var(--display);font-weight:500;
  padding:4px 2px;font-size:10.5px;line-height:1.25;position:sticky;top:0;z-index:3}
table.wide thead tr:first-child th{background:var(--maroon-dk);font-size:12px;letter-spacing:.03em}
table.wide thead th.brk{background:var(--maroon-dk)}
table.wide th.tname,table.wide td.tname{position:sticky;inset-inline-start:0;z-index:4;min-width:132px;
  max-width:132px;text-align:start;padding:4px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
table.wide th.tname{background:var(--maroon-dk);z-index:6}
table.wide td.tname{background:#FBF8F3;font-weight:600;font-size:11.5px;border-inline-end:2px solid var(--rule)}
table.wide td.cell{text-align:center;height:34px;padding:2px 1px;line-height:1.15;min-width:42px}
table.wide td.cell .c{font-weight:600;font-size:11px;display:block}
table.wide td.cell .s{font-size:8.5px;color:var(--ink-soft);display:block}
table.wide td.brk{background:#FAF6EE}
table.wide td.off{background:var(--orange-tint)}
table.wide td.off .c{color:var(--orange-ink)}
table.wide .duty{font-size:8.5px;padding:1px 4px}
table.wide tr.dim td{opacity:.3}
table.wide tr.focus td{background:var(--maroon-tint)}
table.wide tr.focus td.tname{background:var(--maroon);color:#fff}
table.wide td.daysep{border-inline-start:2px solid var(--rule)}
.numcol{background:#FBF8F3;text-align:center;font-weight:600;width:56px}
.pstats{display:flex;gap:22px;flex-wrap:wrap;padding:12px 16px;background:var(--maroon-tint);
  border-inline-start:3px solid var(--maroon);border-radius:2px;font-size:13.5px}
.pstats b{font-family:var(--display);font-size:22px;color:var(--maroon-dk);margin-inline-end:6px}
table.pgrid{border-collapse:collapse;width:100%;font-size:13.5px;min-width:780px}
table.pgrid th{background:var(--maroon);color:#fff;font-family:var(--display);font-weight:500;padding:8px 6px;font-size:12.5px}
table.pgrid th .tm{display:block;font-size:10px;opacity:.78;font-family:"IBM Plex Sans Arabic"}
table.pgrid th.dayh{background:var(--maroon-dk);text-align:start;padding-inline-start:14px;min-width:100px}
table.pgrid td{border:1px solid var(--rule-soft);text-align:center;height:54px;padding:4px;vertical-align:middle}
table.pgrid td.has{background:var(--sky-tint)}
table.pgrid td.has .c{font-weight:700;font-size:15px;display:block;color:var(--maroon-dk)}
table.pgrid td.has .s{font-size:11px;color:var(--ink-soft)}
table.pgrid td.off{background:var(--orange-tint)}
table.pgrid td.off .c{color:var(--orange-ink)}
table.pgrid td.dutyc{background:var(--maroon-tint)}
table.pgrid td.freec{color:var(--ink-faint);font-size:11.5px}
table.pgrid td.brkc{background:#FAF6EE;color:var(--ink-faint);font-size:11.5px}
table.pgrid th.brkh{background:var(--maroon-dk)}
table.pgrid td.has .s.gap{color:#B32B27;font-weight:600}
table.pgrid td.has{background:var(--sky-tint)}
table.pgrid td.has.off{background:var(--orange-tint)}
table.pgrid td.dutyc.extd{background:var(--orange-tint)}
table.pgrid td.mv{background:#FDE3E3!important;box-shadow:inset 0 0 0 2px #B32B27}
.mvt{display:block;margin-top:3px;font-size:10px;font-weight:700;color:#B32B27}
table.pgrid td.chg{outline:2px dashed var(--orange-ink);outline-offset:-3px}
.was{display:block;margin-top:3px;font-size:10px;font-weight:700;color:var(--orange-ink)}
table.pgrid td.has.off .c{color:var(--orange-ink)}
table.pgrid td.multi .row2{display:block;border-top:1px dashed var(--rule);margin-top:3px;padding-top:3px}
table.list{width:100%;border-collapse:collapse;font-size:14px}
table.list thead th{font-family:var(--display);font-weight:600;font-size:13px;text-align:start;color:#fff;
  background:var(--maroon);padding:9px 12px;white-space:nowrap}
table.list tbody td{border-bottom:1px solid var(--rule);padding:9px 12px;vertical-align:middle}
table.list tbody tr:hover{background:#FDFAF6}
.daybar td{background:var(--beige)!important;font-family:var(--display);font-weight:600;color:var(--maroon-dk);padding:6px 12px!important}
.per{font-family:var(--display);font-size:16px;color:var(--maroon);line-height:1.1;display:block}
.time{font-size:11px;color:var(--ink-soft)}
.cls{font-weight:600}.subj{font-size:11.5px;color:var(--ink-soft);display:block}
.tagoff{display:inline-block;font-size:10.5px;background:var(--orange-tint);color:var(--orange-ink);
  border:1px solid #EBC9A6;border-radius:2px;padding:0 6px;margin-inline-start:6px}
select.none{border-color:#C9302C;color:#B32B27;background:#FCEDEC}
.alt{font-size:12px;color:var(--ink-soft)}
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:8px}
.chip{position:relative;display:flex;align-items:center;justify-content:space-between;gap:8px;background:#fff;
  border:1px solid var(--rule);border-radius:3px;padding:8px 11px;cursor:pointer;font-size:14px;
  text-align:start;font-family:inherit;color:var(--ink);transition:.15s ease}
.chip:hover{border-color:var(--rose);background:#FDFAF6}
.chip:focus-visible{outline:2px solid var(--maroon);outline-offset:2px}
.chip .nm{font-weight:600}
.chip .mt{font-size:11px;color:var(--ink-soft);display:block;font-weight:400}
.chip .ld{font-size:11.5px;color:var(--ink-soft);background:var(--paper);border:1px solid var(--rule);
  border-radius:2px;padding:1px 7px;flex:none}
.chip[aria-pressed="true"]{background:var(--maroon);border-color:var(--maroon);color:#fff}
.chip[aria-pressed="true"] .mt{color:#EBD3DC}
.chip[aria-pressed="true"] .ld{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.3);color:#fff}
.chip[aria-pressed="true"]::after{content:attr(data-flag);position:absolute;top:-9px;inset-inline-start:9px;
  font-family:var(--display);font-size:10px;letter-spacing:.12em;color:var(--maroon);background:var(--paper);
  border:1.5px solid var(--maroon);border-radius:2px;padding:1px 7px;transform:rotate(-3deg)}
.summary{display:flex;gap:24px;flex-wrap:wrap;padding:12px 16px;background:var(--maroon-tint);
  border-inline-start:3px solid var(--maroon);border-radius:2px;margin-bottom:16px;font-size:13.5px}
.summary b{font-family:var(--display);font-size:20px;color:var(--maroon-dk);margin-inline-end:6px}
.empty{text-align:center;padding:48px 20px;color:var(--ink-soft)}
.empty .big{font-family:var(--display);font-size:19px;color:var(--maroon-dk);margin-bottom:6px}
table.dutytbl{width:100%;border-collapse:collapse;font-size:13.5px}
table.dutytbl th{background:var(--maroon);color:#fff;font-family:var(--display);font-weight:500;padding:9px 10px;font-size:13px}
table.dutytbl th .tm{display:block;font-size:10.5px;opacity:.8;font-family:"IBM Plex Sans Arabic"}
table.dutytbl td{border:1px solid var(--rule-soft);padding:9px 10px;vertical-align:top}
table.dutytbl td.dayc{background:#FBF8F3;font-family:var(--display);font-weight:600;color:var(--maroon-dk);
  text-align:center;white-space:nowrap}
.post{display:flex;align-items:center;gap:8px;padding:3px 0;border-bottom:1px dotted var(--rule-soft)}
.post:last-child{border-bottom:0}
.ploc{font-size:11.5px;color:var(--ink-soft);min-width:108px;flex:none}
.post .dname{margin:0}
.dname{display:inline-block;background:var(--paper);border:1px solid var(--rule);border-radius:2px;
  padding:2px 9px;margin:2px 3px 2px 0;font-size:13px}
.dname.me{background:var(--maroon);color:#fff;border-color:var(--maroon);font-weight:600}
table.dutytbl th.y7h{background:#6B4A2F}
table.dutytbl td.y7col{background:#FCF6EF}
table.dutytbl td.y7col .ploc{min-width:0;font-size:10.5px;color:var(--orange-ink)}
.ptime{font-size:11px;color:var(--orange-ink);font-weight:600;background:var(--orange-tint);
  border:1px solid #EBC9A6;border-radius:2px;padding:1px 6px;white-space:nowrap}
.legend{font-size:12px;color:var(--ink-soft);margin-top:12px;line-height:1.9}
footer{margin-top:24px;padding-top:14px;border-top:1px solid var(--rule);font-size:12px;color:var(--ink-soft)}
[hidden]{display:none!important}
@media (max-width:700px){h1{font-size:24px}.wrap{padding:0 12px 48px}nav button{padding:9px 12px;font-size:14px}}
.printhint{font-size:12px;color:#B32B27;margin-inline-start:6px}
@media print{
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body{background:#fff}nav,.controls,.daytabs,.no-print,.roster,.lang{display:none!important}
  .panel{box-shadow:none;border:0;padding:0}
  .scroll{overflow:visible!important;border:0;width:100%}
  .wrap{max-width:none;padding:0}
  table.grid{min-width:0;font-size:9px}
  /* الجدول الشامل: يُضغط ليتسع في عرض الصفحة كاملاً */
  table.wide{min-width:0!important;width:100%!important;table-layout:fixed;font-size:6px}
  table.wide th,table.wide td{padding:0!important;overflow-wrap:anywhere;word-break:break-word}
  table.wide thead th{font-size:5.5px;padding:1px 0!important}
  table.wide td.cell{height:auto;min-width:0;line-height:1.05}
  table.wide td.cell .c{font-size:6px}
  table.wide td.cell .s{font-size:4.6px}
  table.wide .duty{font-size:4.6px;padding:0 1px}
  table.wide th.tname,table.wide td.tname{position:static!important;min-width:0;max-width:none;
    width:52px;font-size:6.5px;padding:0 2px!important;white-space:normal}
  table.wide .numcol{width:16px}
  table.pgrid,table.dutytbl,table.list{font-size:10px}
  select{border:0;-webkit-appearance:none;appearance:none}
  @page{size:A4 landscape;margin:8mm}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">

  "duty.rules":"قواعد التوزيع: المعلم متفرغ فعلياً وقت الفسحة · <b>من نصابه ٦ حصص فأكثر في ذلك اليوم لا يُكلَّف بمناوبة فيه</b> · بحد أقصى مناوبتان في اليوم الواحد · لا يُكلَّف معلم بالفسحتين الثانية والثالثة متتاليتين.<br>المواقع: الفسحتان الأولى والثالثة ستة مواقع (ملعب كرة القدم · الساحة الخلفية · الاستقبال · الكانتين · ممر الدور الأرضي · ممر الدور الأول والثاني)، والفسحة الثانية أربعة. والاستقبال لد. ماهر دائماً، فيبقى خمسة معلمين في الأولى والثالثة وثلاثة في الثانية. ومشرف الساحة الخلفية يتنقل في أرجائها كلها.<br>أنصبة الإشراف للمعلمين: خمس مناوبات لكل معلم، وست لمدحت وحمزة وفرانسيس لقلة نصابهم من الحصص، وأربع لزاهر. ووُزّعت المواقع بحيث لا يلزم المعلمَ موقعٌ واحد طوال الأسبوع. والمناوبات التي تغيّر صاحبها تظهر في «جدول معلم» بإطار متقطّع.<br>الأستاذ Zaher مناوباته في الفسحة الأولى فقط بناءً على طلبه، لأن ظهيرته مزدحمة بالحصص.<br><b>صف ٧ في مبنى البنين:</b> فسحته الأولى ٩:٤٥–١٠:١٥ ويشرف عليها محمد لنجاوي كل يوم، وأيمن كل يوم عدا الثلاثاء، وإبراهيم الاثنين والثلاثاء والأربعاء، ويوسف الأحد والثلاثاء والخميس.<br>فسحة غداء صف ٧ (١٢:٣٠–١:١٥) في مبنى البنين مع صف ٨: عبدالله من ١٢:٣٠ إلى ١٢:٤٥ من الأحد إلى الأربعاء والفسحة كاملة الخميس، ومحمد لنجاوي عدا الخميس، وطاهر الأحد، ونبيل الاثنين والأربعاء والخميس، وأيمن الثلاثاء.<br><b>يمان ويوسف:</b> مناوبات يمان الخمس في المبنى الرئيسي، ولا تُحسب ضمن مواقع مبنى البنين. حصته الخامسة مع صف ٧ تنتهي ١٢:٣٠ في مبنى البنين، فيشرف يوسف على موقعه في المبنى الرئيسي من ١٢:٣٠ إلى ١٢:٤٥ كل يوم حتى يصل يمان، ثم يكمل يمان إلى ١:١٥.<br>المعلم Will (تربية بدنية) متاح للإشراف الاثنين من ١٢:٣٠ والأربعاء من ١٠:٣٠، بمناوبة واحدة في اليوم.<br>ويوسف على «ممر الدور الأرضي» في الفسحة الأولى الاثنين والأربعاء. وممر الدور الأرضي يوم الثلاثاء يتولاه نيل.<br>حصص الصف السادس (عبدالله ويمان) في المبنى الرئيسي، ورُتّبت حصص الصف السادس رجال ألمع بحيث لا ينتقل أي منهما بين حصتين في المبنيين دون فاصل.",

function moveKeys(n,d){
  const tm=s=>{let [h,m]=s.split(":").map(Number);if(h<8)h+=12;return h*60+m;};
  const rg=s=>s.split("–").map(x=>tm(x.trim()));
  const ev=[];
  for(const [k,l] of Object.entries(T[n].lessons)){const [dd,s]=k.split("|");if(dd!==d||l.room==="away")continue;
    const sl=SLOTS.find(x=>x.k===s);const [a,b]=rg(l.tm||sl.t);ev.push({a,b,m:!!l.off,k:s});}
  for(const s of ["B1","B2","B3"]){const x=(DUTY.duties[d+"|"+s]||[]).find(e=>e.n===n);if(!x)continue;
    const [a,b]=rg(x.note||SLOTS.find(y=>y.k===s).t);ev.push({a,b,m:x.bld==="ext",k:s});}
  ev.sort((x,y)=>x.a-y.a);const out=new Set();
  for(let i=0;i+1<ev.length;i++){const x=ev[i],y=ev[i+1];if(y.a<=x.b&&x.m!==y.m){out.add(x.k);out.add(y.k);}}
  return out;
}

/* ================= ٥) تغطية الغياب ================= */
const prevSlot=s=>ORDER[ORDER.indexOf(s)-1]||null;
const nextSlot=s=>ORDER[ORDER.indexOf(s)+1]||null;
const dayLoad=(n,d)=>SLOTS.filter(x=>les(n,d,x.k)).length;
/* Year 7 period 3 runs 10:15–11:00 and the Year 7 break 9:45–10:15: block covers that would clash with a duty */
function busyReal(n,d,s,lesson){
  const b1=(DUTY.duties[d+"|B1"]||[]).find(x=>x.n===n);
  if(lesson.tm) return !!les(n,d,"3")||!!(b1&&b1.bld!=="y7");   // 10:15–11:00 overlaps period 3 (to 10:30) and any 10:30 duty
  if(s==="3") return !!les(n,d,"B1")||!!(b1&&b1.bld==="y7");    // 9:45–10:30 overlaps Year 7 period 3 (from 10:15) and the 9:45 Year 7 duty
  return false;
}
function candidates(d,s,lesson,taken,dayCount){
  return BY_NAME.filter(n=>!NO_COVER.has(n)&&!state.absent.has(n)&&!les(n,d,s)&&!taken.has(n)
    &&!(T[n].y7&&!lesson.off)&&!busyReal(n,d,s,lesson)).map(n=>{
    const dl=dayLoad(n,d), got=dayCount[n]||0;
    const p=les(n,d,prevSlot(s)), x=les(n,d,nextSlot(s));
    const cross=(p&&p.off!==lesson.off)||(x&&x.off!==lesson.off);
    const same=T[n].subject.includes(SUBJ_FULL[lesson.sub]||lesson.sub);
    return {n,dl,got,same,cross,score:(dl+got)*100+(cross?40:0)+T[n].load+dutyOf(n)};
  }).sort((a,b)=>a.score-b.score||a.n.localeCompare(b.n));
}
function lessonsFor(d){
  const out=[];
  for(const s of SLOTS) for(const n of BY_NAME)
    if(state.absent.has(n)&&les(n,d,s.k)) out.push({d,s:s.k,time:les(n,d,s.k).tm||s.t,label:s.n,n,l:les(n,d,s.k)});
  return out;
}
function renderRoster(){
  const el=document.getElementById("roster"); el.innerHTML="";
  BY_LOAD.forEach(n=>{
    const b=document.createElement("button"); b.className="chip"; b.type="button";
    b.setAttribute("aria-pressed",state.absent.has(n)); b.dataset.flag=t("w.absent");
    b.innerHTML=`<span><span class="nm">${n}</span><span class="mt">${esc(roleName(n))}</span></span><span class="ld">${T[n].load}</span>`;
    b.onclick=()=>{state.absent.has(n)?state.absent.delete(n):state.absent.add(n);state.manual={};renderCover();};
    el.appendChild(b);
  });
  document.getElementById("absHint").textContent =
    state.absent.size? t("cover.absentList")+[...state.absent].join(" · ") : t("cover.none");
}
function renderCover(){
  renderRoster();
  dayTabs(document.getElementById("cdays"),state.cday,d=>{state.cday=d;renderCover();},d=>lessonsFor(d).length);
  const box=document.getElementById("coverBox"), sum=document.getElementById("csum");
  const rows=lessonsFor(state.cday);
  if(!state.absent.size){sum.hidden=true;
    box.innerHTML=`<div class="empty"><div class="big">${t("cover.empty1")}</div>${t("cover.empty2")}</div>`;return;}
  if(!rows.length){sum.hidden=true;
    box.innerHTML=`<div class="empty"><div class="big">${t("cover.noLessons")}${dayName(state.cday)}</div>${t("cover.noLessons2")}</div>`;return;}
  const taken={},assigned={},dayCount={}; let uncovered=0;
  const body=rows.map(r=>{
    taken[r.s]=taken[r.s]||new Set();
    const cands=candidates(r.d,r.s,r.l,taken[r.s],dayCount);
    const key=`${r.d}|${r.s}|${r.n}`;
    let pick = key in state.manual ? state.manual[key] : (cands[0]?cands[0].n:"");
    if(pick&&!cands.some(c=>c.n===pick)) pick=cands[0]?cands[0].n:"";
    if(pick){taken[r.s].add(pick);assigned[pick]=(assigned[pick]||0)+1;dayCount[pick]=(dayCount[pick]||0)+1;} else uncovered++;
    const opts=[`<option value=""${pick?"":" selected"}>${t("cover.noCover")}</option>`].concat(
      cands.map(c=>`<option value="${c.n}"${c.n===pick?" selected":""}>${c.n} · ${t("cover.today")} ${c.dl+c.got} · ${t("cover.week")} ${T[c.n].load}${c.same?t("cover.sameSubj"):""}${c.cross?t("cover.cross"):""}</option>`)).join("");
    const alts=cands.filter(c=>c.n!==pick).slice(0,3).map(c=>`${c.n} (${c.dl+c.got})`).join(" · ");
    return `<tr>
      <td><span class="per">${r.label}</span><span class="time">${r.time}</span></td>
      <td><span class="cls">${esc(r.l.cls)}</span>${r.l.off?`<span class="tagoff">${LANG==="ar"?"المبنى الآخر":"Other building"}</span>`:""}<span class="subj">${subjName(r.l.sub)}</span></td>
      <td style="color:var(--maroon-dk);font-weight:500">${r.n}</td>
      <td><select data-k="${key}" class="${pick?"":"none"}">${opts}</select></td>
      <td class="alt">${alts||t("cover.noAlt")}</td></tr>`;
  }).join("");
  box.innerHTML=`<table class="list"><thead><tr><th>${t("th.period")}</th><th>${t("th.classSubj")}</th><th>${t("th.absent")}</th><th>${t("th.cover")}</th><th>${t("th.alts")}</th></tr></thead>
    <tbody><tr class="daybar"><td colspan="5">${dayName(state.cday)} — ${rows.length} ${t("cover.needs")}</td></tr>${body}</tbody></table>`;
  box.querySelectorAll("select").forEach(s=>s.onchange=e=>{state.manual[e.target.dataset.k]=e.target.value;renderCover();});
  const names=Object.keys(assigned).sort((a,b)=>assigned[b]-assigned[a]);
  sum.hidden=false;
  sum.innerHTML=`<div><b>${rows.length}</b>${t("cover.needs")}</div><div><b>${names.length}</b>${t("cover.assigned")}</div>
    ${uncovered?`<div style="color:#B32B27"><b style="color:#B32B27">${uncovered}</b>${t("cover.uncovered")}</div>`:""}
    <div style="flex:1;min-width:220px;color:var(--ink-soft)">${names.map(n=>`${n} × ${assigned[n]}`).join(" · ")||"—"}</div>`;
}

const LR=s=>"\u200E"+s+"\u200E";
const TMS=s=>LR(String(s).replace(/\s*–\s*/g,"\u2009–\u2009"));
function sheetHead(title,role,stats){
  const logo=document.querySelector(".mark");

function sheetFoot(keys,note){

    <div style="flex:none">${t("pr.printed")} ${new Date().toLocaleDateString(LANG==="ar"?"ar-SA-u-ca-gregory-nu-latn":"en-GB")}</div></div>`;

function sheetTeacher(n){

  let MV, mvAny=false;
  const rows=DAYS.map(d=>(MV=moveKeys(n,d),mvAny=mvAny||MV.size>0,`<tr><th>${dayName(d)}</th>`)+SLOTS.map(s=>{
    const l=les(n,d,s.k);
    if(l){ const w=l.wasP?(LANG==="ar"?"نُقلت من الحصة "+l.wasP:"moved from P"+l.wasP):l.wasT?(LANG==="ar"?"كانت مع "+LR(l.wasT):"was "+l.wasT):"";
      if(w) chg=true; if(l.off) off=true;

    const du=dutyAt(n,d,s.k);

    return s.k==="B1"?`<td class="b">${t("w.break")}</td>`:s.brk?`<td class="b"></td>`:`<td class="f"></td>`;

  const stats=sup?[[dutyOf(n),t("st.duty")]]:L.ext?[[lessons,t("st.load")]]:[[lessons,t("st.load")],[dutyOf(n),t("st.duty")]];

  if(off) keys.push(["#FBEEE2",t("pr.k.main")]);

function shortCls(c){ return (I18N[LANG].clsShort&&I18N[LANG].clsShort[c])||c; }
function sheetClass(cid){
  const C=CLASSES[cid]; let filled=0; const staff=new Set();
  const head=`<tr><th style="width:25mm">${t("th.day")}</th>`+C.slots.map(([k,tm])=>`<th class="${k[0]==="B"?"bh":""}">${k[0]==="B"?t("w.break"):k.slice(1)}<span class="tm">${TMS(tm)}</span></th>`).join("")+`</tr>`;
  const rows=DAYS.map(d=>`<tr><th>${dayName(d)}</th>`+C.slots.map(([k])=>{
    if(k[0]==="B") return `<td class="b">${t("w.break")}</td>`;

    if(!cells||!cells.length) return `<td class="f"></td>`;
    filled++;
    return `<td class="l">`+cells.map((c,i)=>{ if(c.t) staff.add(c.t);
      return `<span class="${i?"row2":""}"><span class="c">${cSub(c.sub)}</span><span class="s">${c.t?LR(c.t):"—"}</span></span>`;}).join("")+`</td>`;
  }).join("")+`</tr>`).join("");

const PR_CLASSES=["7-W","7-D","8","9","10","11","12-A","12-D","13"];
const PR_TEACHERS=()=>ALL_NAMES.slice().sort((a,b)=>(!!T[a].sup-!!T[b].sup)||(!!T[a].ext-!!T[b].ext)||a.localeCompare(b));
function sheetsDoc(html){
  return `<!DOCTYPE html><html lang="${LANG}" dir="${LANG==="ar"?"rtl":"ltr"}"><head><meta charset="utf-8"><title>${t("title")}</title>`+
    `<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">`+
    `<style>@page{size:A4 landscape;margin:0}html,body{margin:0;padding:0;background:#fff}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}${SHEET_CSS}</style></head><body>${html}</body></html>`;
}
function printSheets(html){
  const doc=sheetsDoc(html);
  const fr=document.createElement("iframe");
  fr.style.cssText="position:fixed;right:0;bottom:0;width:0;height:0;border:0;visibility:hidden";
  document.body.appendChild(fr);
  const d=fr.contentWindow.document; d.open(); d.write(doc); d.close();
  const go=()=>{ try{ fr.contentWindow.focus(); fr.contentWindow.print(); }catch(e){ fallback(); } setTimeout(()=>fr.remove(),60000); };
  const fallback=()=>{ const w=window.open("","_blank"); if(w){ w.document.open(); w.document.write(doc); w.document.close(); setTimeout(()=>{try{w.focus();w.print();}catch(e){}},800);} else { showHint(t("print.blocked")); } };
  const ready=fr.contentWindow.document.fonts?fr.contentWindow.document.fonts.ready:Promise.resolve();
  Promise.race([ready,new Promise(r=>setTimeout(r,1500))]).then(()=>setTimeout(go,250));
}
function showHint(msg){ const hs=[...document.querySelectorAll("[data-hint]")]; hs.forEach(h=>h.textContent=msg); setTimeout(()=>hs.forEach(h=>h.textContent=""),9000); }

/* ---- تنزيل ملف مضغوط: ملف PDF لكل معلم أو لكل فصل ---- */
const LIBS=["https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js",
            "https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"];
let libsP=null, fontP=null;
function loadLibs(){
  if(libsP) return libsP;
  libsP=Promise.all(LIBS.map(src=>new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=()=>rej(new Error(src));document.head.appendChild(s);})));
  libsP.catch(()=>{libsP=null;});
  return libsP;
}
/* الخط يُضمَّن داخل الصورة حتى يظهر في ملف PDF كما في الصفحة */
function blobToData(b){return new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b);});}
function embedFont(){
  if(fontP) return fontP;
  fontP=(async()=>{try{
    const css=await (await fetch("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap")).text();
    const blocks=css.split("/*").slice(1).map(b=>"/*"+b).filter(b=>/\/\*\s*(arabic|latin)\s*\*\//.test(b));
    const out=[];
    for(const b of blocks){const m=b.match(/url\((https:[^)]+)\)/); if(!m) continue;
      const data=await blobToData(await (await fetch(m[1])).blob()); out.push(b.replace(m[1],data));}
    return out.join("\n");
  }catch(e){ return ""; }})();
  return fontP;
}
const PX_W=1123, PX_H=794, SCALE=2.5;
function sheetToCanvas(html,fontCSS){
  return new Promise((res,rej)=>{
    const box=document.createElement("div");
    box.innerHTML=`<style>${fontCSS}${SHEET_CSS}.sheet{width:${PX_W}px;height:${PX_H}px}</style><div style="width:${PX_W}px;height:${PX_H}px;transform:scale(${SCALE});transform-origin:0 0;background:#fff">${html}</div>`;
    const xml=new XMLSerializer().serializeToString(box);
    const W=Math.round(PX_W*SCALE), H=Math.round(PX_H*SCALE);
    const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}"><foreignObject x="0" y="0" width="${W}" height="${H}">${xml}</foreignObject></svg>`;
    const img=new Image();
    img.onload=()=>{ setTimeout(()=>{ try{
      const cv=document.createElement("canvas"); cv.width=W; cv.height=H;
      const ctx=cv.getContext("2d"); ctx.fillStyle="#fff"; ctx.fillRect(0,0,W,H); ctx.drawImage(img,0,0,W,H);
      res(cv); }catch(e){ rej(e); } },30); };
    img.onerror=()=>rej(new Error("svg"));
    img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg);
  });
}
const safeName=s=>String(s).replace(/[\\/:*?"<>|]+/g,"-").replace(/\s+/g," ").trim();
async function zipSheets(kind,btn){
  const label=btn.textContent; btn.disabled=true;
  try{
    btn.textContent=t("zip.loading");
    const [,fontCSS]=await Promise.all([loadLibs(),embedFont()]);
    const items=kind==="me"?PR_TEACHERS().map(n=>[sheetTeacher(n),n]):PR_CLASSES.map(c=>[sheetClass(c),CLASSES[c].title]);
    const zip=new JSZip(); const {jsPDF}=window.jspdf;
    let i=0;
    for(const [html,fname] of items){
      i++; btn.textContent=`${t("zip.making")} ${i}/${items.length}`;
      const cv=await sheetToCanvas(html,fontCSS);
      const pdf=new jsPDF({orientation:"landscape",unit:"mm",format:"a4",compress:true});
      pdf.addImage(cv.toDataURL("image/jpeg",0.92),"JPEG",0,0,297,210,undefined,"FAST");
      pdf.setProperties({title:fname});
      zip.file(String(i).padStart(2,"0")+" - "+safeName(fname)+".pdf",pdf.output("arraybuffer"));
    }
    btn.textContent=t("zip.packing");
    const blob=await zip.generateAsync({type:"blob"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
    a.download=(kind==="me"?t("zip.nameMe"):t("zip.nameCls"))+".zip";
    document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},4000);
  }catch(e){ console.error(e); showHint(t("zip.fail")); }
  finally{ btn.disabled=false; btn.textContent=label; }
}
document.getElementById("printMe").onclick=()=>{ if(!state.me){showHint(t("me.empty1"));return;} printSheets(sheetTeacher(state.me)); };
document.getElementById("printCls").onclick=()=>{ if(!state.cls){showHint(t("cls.empty1"));return;} printSheets(sheetClass(state.cls)); };
document.getElementById("printMeAll").onclick=()=>printSheets(PR_TEACHERS().map(sheetTeacher).join(""));
document.getElementById("printClsAll").onclick=()=>printSheets(PR_CLASSES.map(sheetClass).join(""));
document.getElementById("zipMe").onclick=e=>zipSheets("me",e.currentTarget);
document.getElementById("zipCls").onclick=e=>zipSheets("cls",e.currentTarget);

applyStatic(); renderAll(); show("grid");
